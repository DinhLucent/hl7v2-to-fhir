[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hl7v2-to-fhir"
version = "0.1.0"
description = "Lightweight mapping engine translating legacy HL7 v2.x ER7 messages into FHIR R4 Bundles"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Đinh Hoàng Sáng"}]
keywords = ["hl7", "fhir", "healthcare", "interoperability", "lis", "ehr"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
