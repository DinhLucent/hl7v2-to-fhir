# Ruff configuration for hl7v2-to-fhir
target-version = "py310"
line-length = 88

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (3.10+)
    "B",   # flake8-bugbear
]

ignore = [
    "E501", # line too long
]

[format]
quote-style = "double"
indent-style = "space"
